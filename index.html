// --- Weekly History ---
const historyRef = db.ref('history');

// Auto-save current week to history (called when new week data is loaded)
function saveWeekToHistory() {
  // ALWAYS read from Firebase directly — never from local PRODUCTION_DATA
  // This ensures we capture the team's actual work, not stale page data
  dataRef.once('value').then(snapshot => {
    const firebaseData = snapshot.val();
    if (!firebaseData) { alert('No data in Firebase to save.'); return; }

    // Unsanitize and fix arrays just like the listener does
    const unsanitized = unsanitizeKeys(firebaseData);
    const fixedData = fixFirebaseArrays(unsanitized);

    // Sort days by date
    const days = Object.keys(fixedData).sort((a, b) => {
      const getDate = s => { const m = s.match(/(\d{1,2})[\/\-](\d{1,2})/); return m ? parseInt(m[1]) * 100 + parseInt(m[2]) : 0; };
      return getDate(a) - getDate(b);
    });
    const firstDay = days[0];
    if (!firstDay) { alert('No days found in data.'); return; }

    // Safety check: count dishes with final counts
    let totalDishes = 0;
    let dishesWithFinals = 0;
    Object.values(fixedData).forEach(dayData => {
      Object.values(dayData).forEach(stationData => {
        if (!stationData || !Array.isArray(stationData.dishes)) return;
        stationData.dishes.forEach(d => {
          totalDishes++;
          if (d.finalCount && String(d.finalCount).trim() !== '') dishesWithFinals++;
        });
      });
    });

    // Warn if no production data has been entered
    if (dishesWithFinals === 0) {
      const proceed = confirm('Warning: No final counts have been entered for any dish (' + totalDishes + ' dishes total). This looks like raw Queue data — the team may not have started production yet.\n\nSave anyway?');
      if (!proceed) return;
    }

    // Pre-compute PPH for each dish
    const snapshotData = JSON.parse(JSON.stringify(sanitizeKeys(fixedData)));
    Object.entries(snapshotData).forEach(([dayName, dayData]) => {
      Object.values(dayData).forEach(stationData => {
        if (stationData && Array.isArray(stationData.dishes)) {
          stationData.dishes.forEach(d => {
            const pph = calcPPH(d, dayName);
            if (pph !== null) d.storedPPH = pph;
          });
        }
      });
    });

    const weekKey = generateWeekKey(firstDay);
    const historyEntry = {
      weekLabel: firstDay.replace(/^(Tuesday|Wednesday|Monday|Thursday|Friday|Saturday|Sunday)\s*/, 'Week of '),
      savedAt: new Date().toISOString(),
      days: days.join(' & '),
      data: snapshotData
    };

    historyRef.child(weekKey).set(historyEntry).then(() => {
      showSaveNotice('Week saved to history (' + dishesWithFinals + '/' + totalDishes + ' dishes with final counts)');
    });
  });
}

function generateWeekKey(dayLabel) {
  // Extract date like "3/17" from "Tuesday 3/17"
  const match = dayLabel.match(/(\d{1,2})\/(\d{1,2})/);
  if (!match) return 'week-' + Date.now();
  const month = match[1].padStart(2, '0');
  const day = match[2].padStart(2, '0');
  // Determine year based on current date
  const now = new Date();
  const year = now.getFullYear();
  return `${year}-${month}-${day}`;
}

// Save current week snapshot (can be triggered manually or during weekly update)
function saveCurrentWeekSnapshot() {
  saveWeekToHistory();
}

function openHistory() {
  document.getElementById('historyOverlay').classList.add('show');
  loadHistoryList();
}

function closeHistory() {
  document.getElementById('historyOverlay').classList.remove('show');
}

function loadHistoryList() {
  const content = document.getElementById('historyContent');
  const title = document.getElementById('historyTitle');
  title.textContent = 'Production History';
  content.innerHTML = '<div class="history-empty">Loading...</div>';

  historyRef.orderByKey().once('value', (snapshot) => {
    const history = snapshot.val();
    if (!history) {
      content.innerHTML = '<div class="history-empty">No history saved yet.</div><div style="padding: 12px 20px; border-top: 1px solid #e0e0e0;"><button class="btn btn-white" style="width:100%; background:#1B5E20; color:white;" onclick="saveCurrentWeekSnapshot()">Save Current Week to History</button></div>';
      return;
    }

    // Sort weeks newest first
    const weeks = Object.entries(history).sort((a, b) => b[0].localeCompare(a[0]));

    let html = '<div class="history-list">';
    weeks.forEach(([key, week]) => {
      const savedDate = week.savedAt ? new Date(week.savedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
      const totalOrdered = getTotalFromHistoryData(week.data, 'ordered');
      const totalFinal = getTotalFromHistoryData(week.data, 'finalCount');
      html += `
        <div class="history-week" onclick="viewHistoryWeek('${key}')">
          <div class="history-week-title">${week.weekLabel || key}</div>
          <div class="history-week-meta">
            ${week.days || ''} &bull; ${totalOrdered} ordered${totalFinal ? ` &bull; ${totalFinal} plated` : ''} &bull; Saved ${savedDate}
          </div>
        </div>`;
    });
    html += '</div>';

    // Add save current week button
    html += '<div style="padding: 12px 20px; border-top: 1px solid #e0e0e0;"><button class="btn btn-white" style="width:100%; background:#1B5E20; color:white;" onclick="saveCurrentWeekSnapshot()">Save Current Week to History</button></div>';

    content.innerHTML = html;
  });
}

function getTotalFromHistoryData(data, field) {
  let total = 0;
  if (!data) return 0;
  Object.values(data).forEach(day => {
    if (typeof day === 'object' && day !== null) {
      Object.values(day).forEach(station => {
        if (station && station.dishes) {
          station.dishes.forEach(d => {
            const val = parseInt(d[field]) || 0;
            total += val;
          });
        }
      });
    }
  });
  return total;
}

function viewHistoryWeek(weekKey) {
  const content = document.getElementById('historyContent');
  const title = document.getElementById('historyTitle');
  content.innerHTML = '<div class="history-empty">Loading...</div>';

  historyRef.child(weekKey).once('value', (snapshot) => {
    const week = snapshot.val();
    if (!week || !week.data) {
      content.innerHTML = '<div class="history-empty">No data found for this week.</div>';
      return;
    }

    title.textContent = week.weekLabel || weekKey;
    const stationBgs = { 'Queue': '#455A64', 'Station 1': '#1565C0', 'Station 2': '#E65100', 'Station 3': '#6A1B9A', 'Station 4': '#00695C', 'Station 5': '#B71C1C' };

    let html = '<div class="history-detail">';
    html += '<button class="history-back" onclick="loadHistoryList()">&#8592; Back to all weeks</button>';

    Object.entries(week.data).sort((a, b) => {
      const getDate = s => { const m = s.match(/(\d{1,2})[\/\-](\d{1,2})/); return m ? parseInt(m[1])*100+parseInt(m[2]) : 0; };
      return getDate(a[0]) - getDate(b[0]);
    }).forEach(([dayName, dayData]) => {
      html += `<h3 style="margin: 16px 0 8px; font-size: 15px; color: #333;">${dayName}</h3>`;

      Object.entries(dayData).forEach(([stationName, stationData]) => {
        if (!stationData || !stationData.dishes) return;
        const bg = stationBgs[stationName] || '#555';
        const stationOrdered = stationData.dishes.reduce((s, d) => s + (d.ordered || 0), 0);
        const stationFinal = stationData.dishes.reduce((s, d) => s + (parseInt(d.finalCount) || 0), 0);

        // Calculate average PPH for the station
        const pphValues = [];
        let totalPlates = 0, totalMins = 0;
        stationData.dishes.forEach(d => {
          let pph = null;
          if (isExcludedFromPPH(d, dayName)) return;
          if (d.storedPPH !== undefined && d.storedPPH !== null && d.storedPPH !== '') {
            pph = parseInt(d.storedPPH);
          } else if (d.startTime && d.stopTime && d.finalCount) {
            const s = parseTime(String(d.startTime));
            const e = parseTime(String(d.stopTime));
            const f = parseInt(d.finalCount);
            if (s !== null && e !== null && e > s && !isNaN(f)) {
              pph = Math.round((f / (e - s)) * 60);
              totalPlates += f;
              totalMins += (e - s);
            }
          }
          if (pph !== null) pphValues.push(pph);
        });
        const avgPPH = pphValues.length > 0 ? Math.round(pphValues.reduce((a,b) => a+b, 0) / pphValues.length) : null;
        const stationPPH = totalMins > 0 ? Math.round((totalPlates / totalMins) * 60) : null;

        const histOperator = stationData.operator ? ` (${stationData.operator})` : '';
        const pphLabel = avgPPH !== null ? ` | Avg PPH: ${avgPPH}` : '';
        const stPphLabel = stationPPH !== null ? ` | Station PPH: ${stationPPH}` : '';
        html += `<div class="history-station">`;
        html += `<div class="history-station-name" style="background:${bg}">${stationName}${histOperator} — ${stationOrdered} ordered${stationFinal ? `, ${stationFinal} plated` : ''}${pphLabel}${stPphLabel}</div>`;
        html += `<table class="history-table"><thead><tr>
          <th>Dish</th><th>Ordered</th><th>Final</th><th>+/-</th><th>PPH</th><th class="notes-col">Notes</th>
        </tr></thead><tbody>`;

        stationData.dishes.forEach(d => {
          const final = parseInt(d.finalCount) || 0;
          const diff = d.finalCount ? final - d.ordered : null;
          let diffStr = '-', diffColor = 'inherit';
          if (diff !== null) {
            if (diff > 0) { diffStr = '+' + diff; diffColor = '#2E7D32'; }
            else if (diff < 0) { diffStr = '' + diff; diffColor = '#C62828'; }
            else { diffStr = '0'; diffColor = '#999'; }
          }

          // Calculate PPH — use pre-stored value if available, otherwise compute from times
          let pphStr = '-';
          if (isExcludedFromPPH(d, dayName)) { /* Wednesday cookies & muffins: no PPH */ }
          else if (d.storedPPH !== undefined && d.storedPPH !== null && d.storedPPH !== '') {
            pphStr = '' + d.storedPPH;
          } else if (d.startTime && d.stopTime && d.finalCount) {
            const pphStart = parseTime(String(d.startTime));
            const pphStop = parseTime(String(d.stopTime));
            if (pphStart !== null && pphStop !== null && pphStop > pphStart) {
              pphStr = '' + Math.round((final / (pphStop - pphStart)) * 60);
            }
          }

          if (d.carriedTo) { diffStr = '&rarr; ' + carryDestLabel(d); diffColor = '#F57F17'; }
          html += `<tr>
            <td>${d.name}${d.carryId ? `<span style="color:#F57F17;font-size:11px;">${carryLabelText(d)}</span>` : ''}</td>
            <td>${d.ordered}</td>
            <td>${d.finalCount || '-'}</td>
            <td style="color:${diffColor}; font-weight:600;">${diffStr}</td>
            <td>${pphStr}</td>
            <td class="notes-col">${d.notes || ''}</td>
          </tr>`;
        });
        html += '</tbody></table></div>';
      });
    });

    html += '</div>';
    content.innerHTML = html;
  });
}

// ==================== PIN LOGIN ====================
// PINs are checked by Firebase (see hub-auth.js); they are not stored in this page.
function logout() {
    dataRef.off('value', onProductionDataGate);
    HubAuth.signOut();
    userRole = 'team';
    moveMode = false;
    selectedDishes = [];
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-content').style.display = 'none';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-error').textContent = '';
    document.getElementById('pin-input').focus();
}

function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    attachProductionListener();
    init();
}

document.getElementById('pin-input').addEventListener('input', function() {
    const input = this;
    document.getElementById('pin-error').textContent = '';
    if (input.value.length === 4) {
        const pin = input.value;
        input.disabled = true;
        HubAuth.signInWithPin(pin).then(role => {
            userRole = role;
            showApp();
        }).catch(err => {
            document.getElementById('pin-error').textContent = HubAuth.friendlyError(err);
            input.value = '';
        }).finally(() => { input.disabled = false; });
    }
});

// On page load: stay logged in for 24h on this device
HubAuth.restore().then(role => {
    if (role) { userRole = role; showApp(); }
});
</script>
