name: Rim Weekly Order Reminder

# Tuesday 7am Central. Cron is in UTC — 12:00 UTC = 7am CDT (summer).
# If DST ends (November), bump to '0 13 * * 2' for 7am CST.
on:
  schedule:
    - cron: '0 12 * * 2'
  workflow_dispatch:  # allows manual "Run workflow" from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post team reminder to Slack #rim-monthly-inventory
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          cat > /tmp/payload.json <<'EOF'
          {"text":":clipboard: *Good morning team!* Time for the weekly Rim inventory count.\n\nPlease walk through the shelves and enter on-hand counts here before end of shift today:\nhttps://zachlutton.github.io/production-hub/weekly-order.html\n\nLog in with the team PIN (ask Zach in person if you don't have it). Select \"The Rim\" as the location. Enter what you have on hand for each item — the tool will show what needs to be ordered.\n\nZach places the BEK order tomorrow at 6am, so getting this in by 8pm tonight is critical. Thanks! :muscle:"}
          EOF
          curl -sSf -X POST -H 'Content-type: application/json' --data @/tmp/payload.json "$SLACK_WEBHOOK_URL"
