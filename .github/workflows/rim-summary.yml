name: Rim Weekly Order Summary

# Tuesday 9pm Central. Cron is in UTC — 02:00 UTC on Wednesday = 9pm CDT Tuesday (summer).
# If DST ends (November), bump to '0 3 * * 3' for 9pm CST Tuesday.
on:
  schedule:
    - cron: '0 2 * * 3'
  workflow_dispatch:  # allows manual "Run workflow" from the Actions tab

jobs:
  summarize-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        working-directory: scripts
        run: npm install --no-save firebase-admin@^12.0.0

      - name: Run summary script
        working-directory: scripts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node rim-summary.js
