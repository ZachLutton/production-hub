name: Rim Weekly Order Summary

# Wednesday early morning Central, so the BEK order list is waiting before the 6am order.
# Cron is in UTC and GitHub often starts scheduled runs late (we've seen 30-60+ min),
# so this is set for 4:30am CDT to land by ~5:00am.
#   09:30 UTC Wednesday = 4:30am CDT (summer time).
# After DST ends on Nov 1, change this to '30 10 * * 3' (10:30 UTC = 4:30am CST).
# The script reads the most recent Tuesday's counts in America/Chicago time, so the
# UTC run time does not affect which week it reads.
on:
  schedule:
    - cron: '30 9 * * 3'
  workflow_dispatch:  # allows manual "Run workflow" from the Actions tab

jobs:
  summarize-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        working-directory: scripts
        run: npm install --no-save firebase-admin@^12.0.0

      - name: Run summary script
        working-directory: scripts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node rim-summary.js
